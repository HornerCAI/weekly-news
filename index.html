pdates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Bentley CEO Mike Rocco confirmed the brand's first EV \u2014 a Luxury Urban SUV priced comparably to the Bentayga (~$207K) \u2014 remains on track for Q3 2026 teaser and Q3 2027 launch. Customer clinics showed 8-in-10 participants would purchase it. The vehicle will be electric-only, built at Crewe on VW Group PPE platform.", "link": "https://www.thedrive.com/news/bentleys-electric-suv-will-cost-bentayga-money-ceo-says", "source": "The Drive", "date": "Apr 14, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "The Q3 2026 EV teaser will trigger a luxury media push targeting a younger ultra-luxury buyer. Watch for Bentley to invest in premium publisher, CTV, and experiential channels \u2014 an opening for Cox Automotive conversations ahead of the campaign.", "link": "", "source": "", "date": ""}, {"type": "risk", "text": "Bentley CEO cited the Rolls-Royce Spectre experience as a cautionary tale \u2014 orders evaporated after launch due to pricing concerns. The EV's pricing strategy remains uncertain and could affect dealer order momentum.", "link": "https://www.benzinga.com/markets/tech/26/04/51772803/bentley-electric-suv-2027-launch-price-estimate", "source": "Benzinga", "date": "Apr 21, 2026"}]}}, "BMW": {"status": "opp", "sections": {"Leadership Changes": [{"type": "opp", "text": "Milan Nedeljkovi\u0107 officially becomes BMW Group CEO THIS WEEK on May 14, succeeding Oliver Zipse after the May 13 Annual General Meeting. Nedeljkovi\u0107's contract runs through 2031. New CEO transitions create a 90-day window for vendor and partner relationship reviews \u2014 a direct opportunity for Cox Automotive outreach.", "link": "https://www.wardsauto.com/news/bmw-names-milan-Nedeljkovic-CEO-succeeding-oliver-zipse/807431/", "source": "WardsAuto", "date": "Dec 10, 2025"}], "Financial Updates": [{"type": "risk", "text": "BMW Q1 2026 pretax earnings of \u20ac2.3B beat the \u20ac2.2B consensus, but EBIT margin was 5.0% (down from 6.9% YoY); full-year margin guidance held at 4%\u20136% despite tariffs projected to shave ~1.25 ppts off margins. Pre-tax earnings forecast to fall 5%\u20139.9% in 2026.", "link": "https://news.dealershipguy.com/p/bmw-holds-firm-on-2026-outlook-despite-tariff-threats-and-china-weakness", "source": "Dealership Guy", "date": "May 7, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "BMW officially announced 2027 iX3 US pricing on May 7 at $61,500 + $1,350 D&H, with 434-mile EPA range, 800V/400kW charging, and September 25 US market launch. The configurator and $1,000 reservations are live at bmwusa.com \u2014 the first Neue Klasse production model arriving in the US.", "link": "https://www.press.bmwgroup.com/usa/article/detail/T0457571EN_US/bmw-officially-announces-pricing-and-range-for-2027-bmw-ix3-50-xdrive", "source": "BMW Press USA", "date": "May 7, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "New CEO on May 14 + iX3 US pricing announced this week = simultaneous triggers for engagement. Reach out to BMW's marketing and procurement leadership NOW, as new CEOs frequently re-evaluate vendor relationships within 90 days. The iX3 launch will also drive a substantial advertising push this summer.", "link": "https://electrek.co/2026/05/06/bmw-opens-ix3-preorders-61500-up-to-434-miles-range/", "source": "Electrek", "date": "May 6, 2026"}, {"type": "opp", "text": "BMW's iX3 already secured 50,000+ European orders in six months; US configurator is live and launch is September 25. BMW will invest significantly in launch advertising through Q3 \u2014 prime window for Cox Automotive digital and publisher solutions.", "link": "https://www.bimmerfile.com/2026/05/06/2027-bmw-ix3-us-pricing-confirmed-at-61500-configurator-now-live/", "source": "BimmerFile", "date": "May 6, 2026"}]}}, "Cadillac": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "Cadillac overall US volume is contracting as CT4 ends production June 2026, CT5 ends its current generation this year, and XT4/XT6 are already discontinued. The brand is bridging to an EV-dominant future lineup, but near-term volume compression creates dealer cash-flow pressure.", "link": "https://gmauthority.com/blog/2025/12/what-to-expect-from-cadillac-in-2026/", "source": "GM Authority", "date": "Dec 30, 2025"}, {"type": "opp", "text": "May 2026 Cadillac Lyriq incentives include a $2,000 Competitive Conquest Cash allowance for owners/lessees of 19 competitor brands including Tesla, BMW, Mercedes, Rivian, and Genesis \u2014 the broadest conquest offer in the GM luxury lineup.", "link": "https://gmauthority.com/blog/2026/05/cadillac-lyriq-discount-lease-finance-deals-incentives-offers-may-2026/", "source": "GM Authority", "date": "May 8, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Production of the 2027 Cadillac Lyriq is tentatively scheduled to begin July 13 at GM's Spring Hill, TN plant, with US/Canadian parts content rising from 12% to 43% \u2014 a major tariff-mitigating supply chain shift. The 2027 Lyriq also retains Apple CarPlay and Android Auto, differentiating it from other GM EVs.", "link": "https://gmauthority.com/blog/2026/05/cadillac-lyriq-discount-lease-finance-deals-incentives-offers-may-2026/", "source": "GM Authority", "date": "May 8, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "The 2027 Lyriq's retention of Apple CarPlay/Android Auto is a differentiating brand story; Cadillac's marketing team will need to amplify this vs. competitors. A strong media push around the 2027 Lyriq ramp is expected in Q3.", "link": "https://gmauthority.com/blog/2026/05/cadillac-lyriq-discount-lease-finance-deals-incentives-offers-may-2026/", "source": "GM Authority", "date": "May 8, 2026"}, {"type": "risk", "text": "With CT4 ending June 2026 and CT5 closing its current generation this year, Cadillac's sedan lineup is effectively concluding. Dealers managing compressed ICE inventory alongside growing EV mix \u2014 worth surfacing in any Cox Automotive dealer solutions conversation.", "link": "https://kuneschevrolet.com/blog/what-cadillacs-are-discontinuing-in-2026", "source": "Kunes Auto Group", "date": "Oct 2025"}]}}, "Chevrolet": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "opp", "text": "GM's Q1 2026 adjusted EBIT of $4.3B (41% beat vs consensus) reflects strong Chevrolet truck and crossover demand, with incentives at just 4.4% of MSRP \u2014 well below industry average. North America EBIT margin reached 10.1%, signaling Chevy has pricing power.", "link": "https://www.cnbc.com/2026/04/28/general-motors-gm-earnings-q1-2026.html", "source": "CNBC", "date": "Apr 28, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Chevrolet May 2026 national lease offers include Silverado 1500 LT at $530/month $0 down and Silverado EV LT at $819/month $0 down \u2014 competitive positioning vs Ford F-150 Lightning and Ram heading into summer.", "link": "https://www.msn.com/en-us/news/other/chevrolet-launches-new-may-2026-pickup-and-ev-lease-deals/gm-GMDEB692BE", "source": "CarBuzz/MSN", "date": "May 5, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "opp", "text": "Chevrolet's 'See the USA in Your Chevrolet' campaign (launched at Winter Olympics opening ceremony) featured a Silverado ZR2 airlifted to Utah's Castle Rock \u2014 a brand-building, heritage-driven campaign spanning linear TV, digital, and social. Chevy continues to invest heavily in multi-channel truck advertising.", "link": "https://news.gm.com/home.detail.html/Pages/topic/us/en/2026/feb/0205-see-the-usa.html", "source": "GM News", "date": "Feb 5, 2026"}], "Sales Signals": [{"type": "opp", "text": "With the 2026 Silverado in its final model year ahead of an all-new 2027 generation, Chevy is aggressively clearing inventory with up to $7,000 cash or 0% APR through June 1. This end-of-generation window is a prime co-op advertising moment for digital retail push at the dealer level.", "link": "https://gmauthority.com/blog/2026/05/chevy-silverado-discount-lease-finance-deals-incentives-offers-may-2026/", "source": "GM Authority", "date": "May 1, 2026"}, {"type": "opp", "text": "Chevrolet EV market share hit 13% in March 2026 (up from 10% in December), led by Equinox EV and Blazer EV \u2014 both ranked among MotorTrend's best electric SUVs. Strong brand momentum to amplify through digital advertising.", "link": "https://www.marketscreener.com/news/general-motors-earnings-deck-q1-2026-ce7f59d2d989f423", "source": "GM Q1 Earnings Deck", "date": "Apr 28, 2026"}]}}, "Ford Motor Company": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "opp", "text": "Ford Q1 2026 revenue of $43.3B and adjusted EBIT of $3.5B beat estimates; full-year adjusted EBIT guidance raised to $8.5B\u2013$10.5B (up from $8.0B\u2013$10.0B), including a $1.3B one-time IEEPA tariff benefit. CEO Farley credited Ford+ plan momentum; Ford Pro software subscriptions grew 30% YoY to 879,000.", "link": "https://www.cnbc.com/2026/04/29/ford-motor-f-earnings-q1-2026.html", "source": "CNBC", "date": "Apr 29, 2026"}, {"type": "risk", "text": "Ford's strong Q1 was partly boosted by the one-time $1.3B tariff refund; underlying commodity costs (50% aluminum tariff) add ~$2B in 2026 costs. Q1 US retail sales were down 8.7% YoY and the Novelis aluminum mill restart in May is critical to production continuity.", "link": "https://www.sec.gov/Archives/edgar/data/0000037996/000003799626000084/exhibit99toapril292026fo.htm", "source": "Ford 8-K", "date": "Apr 29, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Ford Pro segment generated $1.7B EBIT on $14.7B revenue in Q1 with software and services as the key growth driver; full-year Ford Pro software subscription revenue expected to grow ~8% annually through decade-end \u2014 building a defensible software moat relevant for any Cox Automotive data/connected services pitch.", "link": "https://finance.yahoo.com/markets/stocks/articles/ford-motor-co-f-q1-071743220.html", "source": "Yahoo Finance", "date": "Apr 29, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Ford's raised guidance and strong F-Series positioning (still #1 selling vehicle in Q1 US) with a major Silverado generation change at GM create an advertising window for Ford truck mindshare. Expect Ford to press this advantage in H2 advertising.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}, {"type": "opp", "text": "Ford's annual shareholder meeting is May 14 (same day as BMW CEO transition). Strong Q1 and raised guidance position Ford for continued media investment \u2014 a favorable environment for Cox Automotive digital solutions engagement.", "link": "https://www.sec.gov/Archives/edgar/data/0000037996/000003799626000084/exhibit99toapril292026fo.htm", "source": "Ford 8-K", "date": "Apr 29, 2026"}]}}, "General Motors": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "opp", "text": "GM Q1 2026 adjusted EPS of $3.70 beat consensus of $2.62 by 41%; full-year adjusted EBIT guidance raised to $13.5B\u2013$15.5B. North America EBIT margin hit 10.1%; OnStar digital services revenue exceeded $750M in Q1 (+20%+ YoY). Guidance boosted by $500M IEEPA tariff refund.", "link": "https://www.cnbc.com/2026/04/28/general-motors-gm-earnings-q1-2026.html", "source": "CNBC", "date": "Apr 28, 2026"}, {"type": "risk", "text": "GM booked $1.1B in Q1 EV-related restructuring charges (supplier contract cancellations), adding to $7.6B in EV special charges from 2025. Total gross tariff costs projected at $2.5B\u2013$3.5B for 2026.", "link": "https://www.sec.gov/Archives/edgar/data/0001467858/000146785826000033/gmq12026pressreleaseandfin.htm", "source": "GM 8-K", "date": "Apr 28, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "GM's OnStar digital services are on track for 13M subscribers by year-end 2026 with $7.5B in deferred revenue. Full-year 2026 OnStar revenue guided to $3.1B (+15% YoY) \u2014 GM's software-first narrative is a key investment thesis for 2026.", "link": "https://www.tikr.com/blog/general-motors-q1-2026-earnings-eps-beats-by-40-as-ev-losses-shrink", "source": "TIKR", "date": "May 6, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "GM's strong Q1, raised guidance, and next-gen Silverado reveal expected later in 2026 set up one of the year's biggest truck advertising moments. Plan for a major GM media investment cycle around the new Silverado \u2014 prime window for Cox Automotive dealer digital solutions engagement.", "link": "https://www.marketscreener.com/news/general-motors-earnings-deck-q1-2026-ce7f59d2d989f423", "source": "GM Q1 Earnings Deck", "date": "Apr 28, 2026"}, {"type": "opp", "text": "GM's EV market share reached 13% in March 2026 (up from 10% in December), with Cadillac EVs up 20% YoY and Equinox/Blazer EVs recognized by MotorTrend. Strongest EV momentum inside GM since the Ultium platform launched.", "link": "https://www.marketscreener.com/news/general-motors-earnings-deck-q1-2026-ce7f59d2d989f423", "source": "GM Q1 Earnings Deck", "date": "Apr 28, 2026"}]}}, "Genesis": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "opp", "text": "Genesis US Q1 2026 sales hit a record 18,317 units, up 4.6% YoY \u2014 the only major luxury brand posting positive Q1 growth in a broadly down market. March saw a 4.3% YoY increase led by a 32% jump in GV70 deliveries.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Genesis announced at NYIAS a plan to launch 22 new or updated models through 2030, backed by Hyundai Motor Group's $26B US investment commitment. Company officials stated 2026 ends 'lineup gaps,' with six new models debuting this year alone.", "link": "https://www.motor1.com/news/791883/hyundai-genesis-launch-58-vehicles/", "source": "Motor1", "date": "Apr 2, 2026"}, {"type": "opp", "text": "The Genesis GV90 flagship electric SUV is approaching its H2 2026 production debut, with spy shots confirming near-production interior featuring a 24-inch rolling screen and ultra-luxury materials. Initial US pricing expected around $100K, targeting Cadillac Escalade IQ and Mercedes EQS SUV.", "link": "https://electrek.co/2026/04/08/genesis-gv90-interior-leaks-next-level-luxury-big-screens/", "source": "Electrek", "date": "Apr 8, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Genesis is on its strongest US momentum in brand history with record Q1 results AND the brand's most aggressive product cadence ever. The GV90 launch later this year will be the decade's biggest Genesis advertising moment \u2014 a priority engagement target for Cox Automotive publisher and digital media solutions.", "link": "https://thekoreancarblog.com/genesis-plans-to-launch-8-new-models-by-2027/", "source": "Korean Car Blog", "date": "Mar 25, 2026"}, {"type": "opp", "text": "Genesis's 22-model plan through 2030 signals sustained and growing marketing investment. This is the right moment to deepen a Cox Automotive partnership with Genesis North America before the brand enters its most expansive phase.", "link": "https://www.motor1.com/news/791883/hyundai-genesis-launch-58-vehicles/", "source": "Motor1", "date": "Apr 2, 2026"}]}}, "Honda": {"status": "both", "sections": {"Leadership Changes": [{"type": "risk", "text": "Honda CEO Toshihiro Mibe unveiled a rebuilt mid-to-long-term strategy at Honda's May 14 earnings briefing THIS WEEK. The direction centers on hybrids now, EVs later \u2014 13 new hybrid models globally starting 2027. This is Honda's first formal post-EV-retreat strategic presentation as a public company.", "link": "https://www.autonews.com/honda/an-honda-ev-loss-earnings-restructuring-plan-toshihiro-mibe-0511/", "source": "Automotive News", "date": "May 11, 2026"}], "Financial Updates": [{"type": "risk", "text": "Honda is on track for its first-ever operating loss as a publicly listed company (since 1957), estimated at $2.55B, driven by a 2.5 trillion yen ($15.9B) EV writedown. Honda canceled three planned EVs, shelved its $11B Ontario EV factory, and is extending ICE model lifecycles to conserve capital.", "link": "https://www.autoblog.com/news/hondas-ev-bet-backfires-as-automaker-faces-historic-2-5-billion-loss", "source": "Autoblog", "date": "May 12, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Honda's new strategy centers on 13 new hybrid models globally starting 2027. The Accord, CR-V, Pilot, HR-V, and Odyssey will continue in hybrid-capable platforms \u2014 Honda is leaning into its most profitable vehicles while buying time for a more deliberate EV approach.", "link": "https://www.cbtnews.com/honda-extends-lifecycle-of-five-models/", "source": "CBT News", "date": "May 7, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "risk", "text": "Honda's historic EV loss and May 14 strategy announcement (this week) will generate significant media attention and may signal further model or budget adjustments. Expect Honda's marketing team to be in a cost-discipline posture for 2026.", "link": "https://www.autonews.com/honda/an-honda-ev-loss-earnings-restructuring-plan-toshihiro-mibe-0511/", "source": "Automotive News", "date": "May 11, 2026"}, {"type": "opp", "text": "Honda's hybrid pivot (13 new models by 2031) will require substantial marketing investment to re-educate consumers. Position Cox Automotive solutions around Honda's coming hybrid product wave and the brand's need to rebuild consumer trust.", "link": "https://electrek.co/2026/05/05/honda-shelves-11b-canada-ev-plant-electric-retreat/", "source": "Electrek", "date": "May 8, 2026"}]}}, "Hyundai": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "Hyundai Q1 2026 operating profit fell 30.8% YoY to 2.51 trillion won ($1.72B), with US tariffs costing the company 860 billion won in the quarter alone. Net profit fell 23.6% despite record Q1 revenue of 45.94 trillion won (+3.4%).", "link": "https://www.hyundai.com/worldwide/en/newsroom/detail/hyundai-motor-announces-2026-q1-business-results-0000001162", "source": "Hyundai IR", "date": "Apr 23, 2026"}, {"type": "opp", "text": "Hyundai is ramping US production aggressively at its Georgia Metaplant to reduce tariff exposure, with CEO Mu\u00f1oz stating the company plans to increase US-built vehicle share from ~50% of US sales. A 36-model product offensive through 2030 is backed by a $26B US investment commitment.", "link": "https://www.motor1.com/news/791883/hyundai-genesis-launch-58-vehicles/", "source": "Motor1", "date": "Apr 2, 2026"}], "Competitive Moves & Partnerships": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Digital Advertising & Publisher Activity": [{"type": "opp", "text": "Hyundai is offering up to $10,000 cash back on the 2026 Ioniq 9 Electric and $7,500 on the 2025 Ioniq 6, plus 0% for 72 months on select EVs \u2014 deep incentives signaling a significant advertising push to move EV inventory. Prime window for Cox Automotive digital media engagement.", "link": "https://www.realcartips.com/hyundai-incentives/", "source": "RealCarTips", "date": "May 2026"}], "Sales Signals": [{"type": "opp", "text": "Hyundai hybrid sales surged 47.7% in April 2026 to 21,713 units \u2014 a monthly record \u2014 led by Tucson hybrid and Sonata Hybrid (+171%). Electrified vehicles are now Hyundai's fastest-growing segment; advertising investment in hybrid models will accelerate.", "link": "https://www.aol.com/lifestyle/hyundai-kia-genesis-thrive-amid-000944022.html", "source": "AOL/UPI", "date": "May 5, 2026"}, {"type": "risk", "text": "Despite volume records, Hyundai's profitability is materially hurt by tariffs ($860B in Q1 alone). Marketing budgets may face scrutiny even as product volume grows; watch for rationalization toward highest-ROI channels.", "link": "https://www.hyundai.com/worldwide/en/newsroom/detail/hyundai-motor-announces-2026-q1-business-results-0000001162", "source": "Hyundai IR", "date": "Apr 23, 2026"}]}}, "Infiniti": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Infiniti's 'Vision 2026' plan confirmed by Nissan CEO Espinosa at NYIAS includes five new models through 2030: a revived Q50 performance sedan (Z-based, targeting BMW M340i), body-on-frame SUVs, and hybrids. The all-new QX65 coupe-style fastback SUV is arriving at dealers now.", "link": "https://cars.usnews.com/cars-trucks/advice/infiniti-plans-five-new-models-by-2030", "source": "US News", "date": "Apr 29, 2026"}, {"type": "neutral", "text": "The 2026 Infiniti QX60 launched with a new Sport trim, refreshed exterior, and Google Built-In infotainment \u2014 arriving now at dealers.", "link": "https://usa.infinitinews.com/en-US/releases/release-6a11c143b6bc57f003adcd88ac0054b8-new-2026-infiniti-qx60-is-hereon-sale-from-51200", "source": "Infiniti USA", "date": "Oct 20, 2025"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Infiniti's five-model expansion and QX65 launch now create the brand's most significant product investment cadence in a decade. Each launch requires media support \u2014 the QX65 especially needs consumer awareness advertising. Strong pitch moment for Cox Automotive with Infiniti's marketing team.", "link": "https://cars.usnews.com/cars-trucks/advice/infiniti-plans-five-new-models-by-2030", "source": "US News", "date": "Apr 29, 2026"}, {"type": "risk", "text": "Infiniti sold only ~52,846 US vehicles in 2025 (~a third of its 2017 peak). Marketing budgets will remain constrained until volume shows meaningful recovery.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}]}}, "Jaguar": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "JLR revised its fiscal 2026 EBIT margin forecast to 5\u20137% (from 10%) and projects near-zero free cash flow. Under a UK-US bilateral trade deal announced this month, UK-built Range Rover models face 10% tariff (down from 25%), but the Defender (built in Slovakia/EU) still faces the full 25% duty.", "link": "https://www.cbtnews.com/jaguar-land-rover-slashes-2026-profit-outlook-as-u-s-tariffs-disrupt-sales/", "source": "CBT News", "date": "2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Jaguar's all-new electric Type 01 GT sedan is expected to debut in 2026 at a starting price around $130,000, targeting the ultra-luxury EV space. This is Jaguar's entire product bet \u2014 the first Jaguar since the brand halted ICE production in 2024.", "link": "https://www.autoblog.com/news/jaguars-first-new-car-after-its-rebrand-is-nothing-like-you-expect", "source": "Autoblog", "date": "Dec 19, 2025"}], "Digital Advertising & Publisher Activity": [{"type": "risk", "text": "Jaguar's 'Copy Nothing' brand transformation has left US dealers with essentially no product to sell for over a year. Advertising investment is on hold pending the Type 01 reveal. Cox Automotive media solutions conversations should be framed around the Type 01 launch timeline.", "link": "https://www.autoblog.com/news/jaguars-first-new-car-after-its-rebrand-is-nothing-like-you-expect", "source": "Autoblog", "date": "Dec 19, 2025"}], "Sales Signals": [{"type": "risk", "text": "Jaguar has virtually no current US retail volume while awaiting the electric GT reveal. Near-term advertising revenue from Jaguar dealers is minimal; Cox Automotive conversations should be investment-forward for the Type 01 launch window.", "link": "https://www.cbtnews.com/jaguar-land-rover-slashes-2026-profit-outlook-as-u-s-tariffs-disrupt-sales/", "source": "CBT News", "date": "2026"}, {"type": "opp", "text": "When the Type 01 debuts, Jaguar will need to rebuild consumer awareness and dealer confidence through aggressive premium publisher and digital campaigns. Early relationship-building with JLR's marketing team now positions Cox Automotive for that spend window.", "link": "", "source": "", "date": ""}]}}, "Kia": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "Despite record US sales, Kia's global net profit fell amid aggressive EV discounting to counter Chinese price competition. CEO Song Ho-sung noted the brand has narrowed the price gap with BYD in Europe from 20\u201325% to 15\u201320%, but at a cost to margins.", "link": "https://electrek.co/2026/04/27/kia-slashing-ev-prices-low-cost-rivals/", "source": "Electrek", "date": "Apr 27, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Kia America announced 2026 EV6 pricing on May 4 at $37,900 (down ~$5,000 from 2025) and confirmed the 2027 EV3 all-electric compact SUV will go on sale in the US later in 2026. The dual announcement is Kia's clearest signal of its commitment to mainstream EV adoption.", "link": "https://www.kiamedia.com/us/en/media/pressreleases/24658/kia-announces-pricing-for-2026-ev6", "source": "Kia Media", "date": "May 4, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Kia April 2026 US YTD sales hit 279,718 units, a new four-month record, with hybrid sales surging 70% YoY and EV9 up 481% YoY. The brand is outperforming virtually every rival on electrified model sales \u2014 a strong story to amplify through digital advertising.", "link": "https://www.aol.com/lifestyle/hyundai-kia-genesis-thrive-amid-000944022.html", "source": "AOL/UPI", "date": "May 5, 2026"}, {"type": "opp", "text": "The EV6 price cut and EV3 US launch announcement this week are major product news moments that will drive a media push. Kia will need consumer awareness advertising for the EV3 as a new nameplate \u2014 prime Cox Automotive digital engagement opportunity.", "link": "https://www.kiamedia.com/us/en/media/pressreleases/24658/kia-announces-pricing-for-2026-ev6", "source": "Kia Media", "date": "May 4, 2026"}]}}, "Land Rover": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "JLR revised its fiscal 2026 EBIT margin to 5\u20137% (from 10%) and projects near-zero free cash flow. The Defender (built in Slovakia) faces the full 25% US tariff, while UK-built Range Rovers benefit from the new UK-US 10% bilateral rate announced this month.", "link": "https://www.cbtnews.com/jaguar-land-rover-slashes-2026-profit-outlook-as-u-s-tariffs-disrupt-sales/", "source": "CBT News", "date": "2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Land Rover is running a May\u2013June 2026 conquest lease/purchase incentive offering $1,500 credit to buyers coming from BMW, Mercedes, Lexus, Cadillac, Lincoln, or Tesla \u2014 one of the most explicitly targeted luxury conquest campaigns in the market this month.", "link": "https://www.rangerover.com/en-us/current-offers/range-rover-offers.html", "source": "Range Rover USA", "date": "May 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Land Rover's active conquest offer targeting six specific competitor brands is an aggressive competitive digital marketing moment. This type of campaign typically pairs with targeted programmatic and paid search investment \u2014 a strong talking point for Cox Automotive media engagement with JLR's marketing team.", "link": "https://www.rangerover.com/en-us/current-offers/range-rover-offers.html", "source": "Range Rover USA", "date": "May 2026"}, {"type": "risk", "text": "JLR paused US shipments in April due to tariff uncertainty and resumed under the 10% UK-US bilateral rate \u2014 but the Defender (25% tariff) remains at a competitive disadvantage vs. domestically produced rivals. Price increases to offset tariffs could suppress dealer-level demand.", "link": "https://www.autoblog.com/news/jaguar-land-rover-halts-u-s-shipments-as-tariffs-ramp-up", "source": "Autoblog", "date": "Apr 2026"}]}}, "Lexus": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "Toyota Financial Services CEO Scott Cooke announced retirement effective June 30, 2026.", "link": "https://pressroom.toyota.com/corporate/latest-news/", "source": "Toyota Newsroom", "date": "Apr 3, 2026"}], "Financial Updates": [{"type": "risk", "text": "Lexus April 2026 US sales fell 19.9% YoY to 28,187 units \u2014 one of the steeper declines among luxury brands. This reflects the tough year-ago comp from April 2025's pre-tariff buying surge rather than underlying demand weakness, but warrants monitoring through Q2.", "link": "https://www.carscoops.com/2026/05/april-2026-us-auto-sales/", "source": "Carscoops", "date": "May 4, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Lexus filed trademark applications for a 'GX 550h' name, suggesting a forthcoming hybrid variant of the GX 550 that could significantly increase output (potentially 437\u2013457 hp), narrowing the gap with the Land Rover Defender and other performance off-road SUVs.", "link": "https://carbuzz.com/lexus-may-be-prepping-more-powerful-gx-defender/", "source": "CarBuzz", "date": "Apr 7, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "risk", "text": "Lexus's April decline (~20%) is partly a supply story (RAV4 production ramp-up). If inventory constraints persist into Q2, Lexus may pull back on conquest advertising until supply normalizes; monitor inventory reports through May.", "link": "https://www.carscoops.com/2026/05/april-2026-us-auto-sales/", "source": "Carscoops", "date": "May 4, 2026"}, {"type": "opp", "text": "A GX hybrid announcement in 2026 would be a major product story in the luxury off-road space. Watch for Lexus marketing investment to ramp around that launch as it targets Land Rover Defender and GX-class buyers.", "link": "https://carbuzz.com/lexus-may-be-prepping-more-powerful-gx-defender/", "source": "CarBuzz", "date": "Apr 7, 2026"}]}}, "Lincoln": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Lincoln is reportedly developing a body-on-frame luxury off-road SUV based on the Ford Bronco platform to compete with the Mercedes G-Class, Land Rover Range Rover, and Lexus LX, targeting a 2029\u20132030 launch at an estimated starting price of at least $100K \u2014 Lincoln's most significant new nameplate in decades.", "link": "https://www.carsdirect.com/automotive-news/is-lincoln-building-a-bronco-based-suv", "source": "CarsDirect", "date": "Feb 27, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Ford's strong Q1 results benefit Lincoln's marketing budget health. The refreshed 2026 Lincoln Navigator (new entry-level Premiere trim starting $94,590) is arriving now \u2014 a prime window for Cox Automotive digital retail media conversations with Lincoln's marketing team.", "link": "https://communitynewspapers.com/cars-trucks/2026-lincoln-navigator-is-big-bold-and-beautifully-american/", "source": "Community Newspapers", "date": "Mar 28, 2026"}, {"type": "opp", "text": "The Nautilus has become Lincoln's best-seller (33,744 units in 2025); with the Navigator refresh and a long-term body-on-frame product in development, Lincoln has a multi-year advertising build-up story that supports sustained investment.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}]}}, "Mazda": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "Mazda April 2026 US sales fell 17.3% YoY to 31,128 units \u2014 one of the sharpest brand-level declines in April and the eighth consecutive month of YoY decline. Both the tough year-ago comp and some genuine demand softness are factors.", "link": "https://www.carscoops.com/2026/05/april-2026-us-auto-sales/", "source": "Carscoops", "date": "May 4, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "The fully redesigned 2026 Mazda CX-5 launched with a longer wheelbase, new tech features, and pricing starting at $31,485 \u2014 Mazda's most significant product redesign in years. Automotive News reported this week that Mazda is delaying its dedicated BEV to at least 2029 while focusing on three new hybrids.", "link": "https://www.autonews.com/honda/an-honda-ev-loss-earnings-restructuring-plan-toshihiro-mibe-0511/", "source": "Automotive News", "date": "May 11, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "The all-new CX-5 is Mazda's volume driver and will require sustained launch advertising investment. This is a natural Cox Automotive digital media conversation moment with Mazda's marketing team as the brand repositions around hybrid powertrains.", "link": "https://www.carsdirect.com/automotive-news/2026-mazda-cx-5-launch", "source": "CarsDirect", "date": "Jan 2026"}, {"type": "risk", "text": "Eight consecutive months of US sales declines and a delayed EV strategy suggest Mazda may be in a defensive marketing posture through 2026. Any media spend discussions should lead with hybrid and CX-5 ROI arguments.", "link": "https://www.carscoops.com/2026/05/april-2026-us-auto-sales/", "source": "Carscoops", "date": "May 4, 2026"}]}}, "Mercedes-Benz": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "Mercedes-Benz Q1 2026 EBIT fell 16.8% to \u20ac1.9B on revenue of \u20ac31.6B (down 4.9%). China sales dropped 27% as domestic brands captured luxury share. Carmaking margin compressed to 4.1% from 7.3% YoY; US tariffs projected to shave 1.5 ppts off full-year margin.", "link": "https://group.mercedes-benz.com/investors/reports-news/interim-reports/q1-2026/", "source": "Mercedes-Benz Group IR", "date": "Apr 29, 2026"}, {"type": "opp", "text": "Mercedes US sales grew 20% in Q1 2026 \u2014 one of Mercedes's strongest current markets globally. BEV order intake in Europe more than doubled (+107% YoY). Company maintained full-year guidance with expectations for EBIT 'significantly above' 2025.", "link": "https://group.mercedes-benz.com/investors/reports-news/interim-reports/q1-2026/", "source": "Mercedes-Benz Group IR", "date": "Apr 29, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Mercedes is executing a 16+ model product offensive in 2026 (with more in 2027), including new S-Class, GLS, CLA, GLB, all-electric C-Class, AMG GT electric (1,300 hp), and the electric GLS. This is a massive multi-brand advertising supercycle.", "link": "https://www.autoblog.com/news/mercedes-benz-will-launch-16-new-cars-in-2026-more-in-2027", "source": "Autoblog", "date": "Feb 14, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "With 16+ new or refreshed models launching in 2026 and US sales up 20% in Q1, Mercedes has every incentive to invest heavily in advertising. Cox Automotive digital media solutions are well-positioned given Mercedes's US momentum and product launch volume.", "link": "https://group.mercedes-benz.com/investors/reports-news/interim-reports/q1-2026/", "source": "Mercedes-Benz Group IR", "date": "Apr 29, 2026"}, {"type": "risk", "text": "China sales down 27% is a strategic pressure point. If China weakness deepens, Mercedes may reallocate global marketing budgets toward US-centric conversion advertising \u2014 actually beneficial for Cox Automotive's US-facing solutions.", "link": "https://finance.yahoo.com/markets/stocks/articles/mercedes-benz-q1-2026-earnings-113902581.html", "source": "Yahoo Finance", "date": "Apr 29, 2026"}]}}, "MINI": {"status": "risk", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "BMW's MINI brand is caught in a tariff squeeze: its China-built fully electric MINI models face EU import tariffs, adding to BMW Group's 1.5+ ppt margin drag. MINI US sales fell 10% in Q1 2026.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}], "Competitive Moves & Partnerships": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "risk", "text": "MINI's China-built EV lineup faces tariff headwinds from both EU and US directions, and US sales are declining. Advertising budgets for MINI may face pressure as BMW Group focuses resources on the iX3 Neue Klasse launch. Monitor for any agency review or spend shifts.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}]}}, "Mitsubishi": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "The 2026 Outlander PHEV with refreshed interior, larger battery (22.7 kWh vs 20 kWh), increased all-electric range (45 miles vs 38 miles), more power (297 hp), and new Black Edition trim is arriving at US dealers now (expected May), with a $2,800 price increase on the base model.", "link": "https://www.thetruthaboutcars.com/cars/news-blog/mitsubishi-raises-price-for-improved-outlander-phev-for-2026-45134431", "source": "The Truth About Cars", "date": "Mar 18, 2026"}, {"type": "opp", "text": "Mitsubishi confirmed it will bring a new battery-electric vehicle to North America starting summer 2026, based on the next-generation Nissan LEAF \u2014 Mitsubishi's first-ever BEV in the US market and a key pillar of its Momentum 2030 plan.", "link": "https://media.mitsubishicars.com/en-US/releases/mitsubishi-motors-confirms-all-new-battery-electric-vehicle-will-be-sold-in-north-america-starting-summer-2026", "source": "Mitsubishi Media", "date": "May 6, 2025"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Mitsubishi's first-ever US BEV arriving summer 2026 is the brand's highest-profile product moment in years \u2014 requiring substantial consumer awareness media push. The strongest advertising investment signal from Mitsubishi in recent history.", "link": "https://media.mitsubishicars.com/en-US/releases/mitsubishi-motors-confirms-all-new-battery-electric-vehicle-will-be-sold-in-north-america-starting-summer-2026", "source": "Mitsubishi Media", "date": "May 6, 2025"}, {"type": "opp", "text": "US sales fell 15% in Q1, but Mitsubishi's Momentum 2030 plan (new vehicle every year) and first BEV signal growing media investment needs through the decade. Engage Mitsubishi's marketing team ahead of the BEV launch media plan.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}]}}, "Nissan": {"status": "both", "sections": {"Leadership Changes": [{"type": "risk", "text": "Nissan CFO J\u00e9r\u00e9mie Papin stepped down for personal reasons and was replaced by George Leondis effective April 1, 2026 \u2014 a significant leadership change during the company's most critical financial restructuring period in decades.", "link": "https://www.bloomberg.com/news/articles/2026-03-10/nissan-names-new-cfo-as-carmaker-struggles-with-turnaround", "source": "Bloomberg", "date": "Mar 10, 2026"}], "Financial Updates": [{"type": "risk", "text": "Nissan projects a net loss of \u00a5650B (~$4.2B) for fiscal year ending March 2026. The Re:Nissan plan targets $1.6B in variable cost savings and $1B+ in fixed cost reductions, consolidating 17 production plants to 10 by FY2027 and cutting 20,000 jobs globally.", "link": "https://www.carpro.com/blog/first-quarter-2026-u.s.-auto-sales-results-all-automakers-reporting", "source": "Carpro Q1 Sales", "date": "Apr 14, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Nissan's 'Vision 2026' product plan includes 5 new Infiniti models through 2030, a revived Q50 performance sedan, new body-on-frame SUVs, a new Leaf EV (US launch summer 2026), and a new Rogue Hybrid with e-Power technology in 2027 \u2014 Nissan's most comprehensive new-product offensive in years.", "link": "https://cars.usnews.com/cars-trucks/advice/infiniti-plans-five-new-models-by-2030", "source": "US News", "date": "Apr 29, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "risk", "text": "Nissan's $4.2B net loss, CFO departure, and deep restructuring plan signal severely constrained advertising budgets in 2026. Focus Cox Automotive engagement on cost-effective, high-ROI digital solutions rather than broad media investment pitches.", "link": "https://www.bloomberg.com/news/articles/2026-03-10/nissan-names-new-cfo-as-carmaker-struggles-with-turnaround", "source": "Bloomberg", "date": "Mar 10, 2026"}, {"type": "opp", "text": "The summer 2026 new Leaf EV and 2027 Rogue Hybrid launches are Nissan's best near-term media investment catalysts. Position Cox Automotive solutions around these specific product launches rather than brand-level campaigns.", "link": "https://cars.usnews.com/cars-trucks/advice/infiniti-plans-five-new-models-by-2030", "source": "US News", "date": "Apr 29, 2026"}]}}, "Polestar": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "Polestar posted a $2.4B net loss for 2025 but crossed into adjusted gross profitability in Q4. Q1 2026 retail sales reached 13,126 vehicles (+7% YoY) across 230 sales points globally (+50% YoY). Path to free cash flow positive by 2027 depends on the model offensive executing on schedule.", "link": "https://grafa.com/en/news/united-states/polestar-q1-2026-retail-sales-expansion", "source": "Grafa", "date": "Apr 9, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Polestar opened orders THIS WEEK (May 12) for the revamped Polestar 3 (now with 800V architecture, 350kW charging, 500kW output) and Polestar 4 coup\u00e9 across Canada and European markets. The Polestar 5 four-door grand tourer begins customer deliveries this summer \u2014 the brand's largest model offensive in its history.", "link": "https://eletric-vehicles.com/geely/polestar/polestar-opens-orders-for-revamped-suv-models-across-canada-and-europe/", "source": "EV Report", "date": "May 12, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Polestar's 50% YoY increase in global sales points and four-model launch cadence signal growing dealer and retail partner network needs \u2014 an opening for Cox Automotive dealer solutions conversations.", "link": "https://grafa.com/en/news/united-states/polestar-q1-2026-retail-sales-expansion", "source": "Grafa", "date": "Apr 9, 2026"}, {"type": "risk", "text": "US tariffs on Korean- and European-produced Polestar models limit lineup availability in North America. Marketing spend likely remains constrained until the brand's profitability path becomes clearer.", "link": "https://insideevs.com/news/787583/polestar-2-new-generation-2027/", "source": "InsideEVs", "date": "Feb 18, 2026"}]}}, "Porsche": elationship Reset Opportunities", "text": "BMW names a new CEO on May 14 (Nedeljkovi\u0107); Porsche's Leiters just completed his first full quarter; Volvo brought back former CEO Samuelsson; Nissan replaced its CFO; Honda's Mibe is effectively rebuilding the company's strategy from scratch. Each of these transitions creates a 90-day window where new leadership re-evaluates vendor relationships, media agencies, and strategic partners. Cox Automotive teams should prioritize outreach at BMW, Porsche, and Volvo this week.", "oems": "BMW, Porsche, Volvo, Nissan, Honda"}, {"title": "Stellantis May 21 Investor Day: The Week's Highest-Stakes Event Coming", "text": "Stellantis's Investor Day on May 21 in Auburn Hills will set brand strategy for all 14 Stellantis brands through the decade. Reuters confirms Jeep, Ram, Peugeot, and Fiat will receive concentrated investment while Alfa Romeo, Dodge, Chrysler, Maserati, and Opel will be repositioned as 'tactical.' The Leapmotor distribution partnership announced this week previews the strategy. Cox Automotive teams should be positioned for real-time intelligence from this event \u2014 advertising budgets at every Stellantis brand will follow from what is announced.", "oems": "Stellantis, Alfa Romeo, Jeep, Ram, Dodge, Chrysler, Maserati"}, {"title": "OEM Digital Advertising Supercycle: Three Major Campaigns Live This Week", "text": "Toyota launched two simultaneous mega-campaigns (RAV4 hybrid and all-electric family), Rivian begins R2 mass-market consumer advertising, Kia needs a media push around the EV6 price cut and EV3 announcement, and Subaru launched three simultaneous EV models. This is one of the most advertising-dense product launch weeks of 2026 \u2014 active media buys are flowing right now, making this the highest-urgency window for Cox Automotive digital media engagement across multiple accounts.", "oems": "Toyota, Rivian, Kia, Subaru, BMW, Chevrolet"}];
const DATE_RANGE="May 6 – 12, 2026";
const DATE_LABEL="May12_2026";

const OEM_NAMES = Object.keys(OEM_DATA);
function getStatus(oem){return OEM_DATA[oem].status;}
function statusBadge(oem){const s=getStatus(oem);if(s==='both')return'🟢🔴';if(s==='opp')return'🟢';if(s==='risk')return'🔴';return'⚪';}
function buildNav(){
  const list=document.getElementById('nav-list');
  let html='<div class="nav-snapshot"><div class="nav-snap-btn active" id="nav-snapshot" onclick="showSnapshot()">📊 Weekly Snapshot</div></div><div class="nav-divider"></div>';
  for(const oem of OEM_NAMES){
    const badge=statusBadge(oem);
    html+=`<div class="nav-item" id="nav-${oem.replace(/ /g,'_')}" onclick="showOEM('${oem}')"><span class="status-dot">${badge}</span><span class="nav-oem-name">${oem}</span></div>`;
  }
  list.innerHTML=html;
}
function filterOEMs(q){
  q=q.toLowerCase();
  for(const oem of OEM_NAMES){
    const el=document.getElementById('nav-'+oem.replace(/ /g,'_'));
    if(el)el.style.display=oem.toLowerCase().includes(q)?'':'none';
  }
}
function setActive(id){
  document.querySelectorAll('.nav-item,.nav-snap-btn').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById(id);if(el)el.classList.add('active');
}
function renderBullet(b){
  let cls='bullet-wrap-neutral',prefix='';
  if(b.type==='risk'){cls='bullet-wrap-risk';prefix='<span class="bullet-prefix-risk">⚠️ Risk</span> — ';}
  if(b.type==='opp'){cls='bullet-wrap-opp';prefix='<span class="bullet-prefix-opp">✅ Opportunity</span> — ';}
  if(b.type==='neutral'&&b.text==='No notable updates this week.')return`<div class="muted-text">No notable updates this week.</div>`;
  let meta='';
  if(b.link&&b.source)meta=`<div class="bullet-meta"><a class="bullet-link" href="${b.link}" target="_blank">${b.source}</a><span class="bullet-date">(Published: ${b.date})</span></div>`;
  return`<div class="${cls}"><div class="bullet-text">${prefix}${b.text}</div>${meta}</div>`;
}
function showOEM(oem){
  document.getElementById('snapshot-page').style.display='none';
  document.getElementById('detail-page').style.display='block';
  setActive('nav-'+oem.replace(/ /g,'_'));
  const data=OEM_DATA[oem];
  const sections=['Leadership Changes','Financial Updates','Competitive Moves & Partnerships','Digital Advertising & Publisher Activity','Sales Signals'];
  let html=`<div class="detail-header"><div class="detail-header-diag"></div><div class="detail-oem-name">${oem}</div><div class="detail-week">Coverage: ${DATE_RANGE}</div></div>`;
  for(const sec of sections){
    const bullets=data.sections[sec]||[];
    let body=bullets.map(b=>renderBullet(b)).join('');
    html+=`<div class="section-card"><div class="section-header" onclick="toggleSection(this)"><span class="section-title">${sec}</span><span class="section-toggle open">▾</span></div><div class="section-body">${body}</div></div>`;
  }
  document.getElementById('detail-page').innerHTML=html;
  document.getElementById('main').scrollTop=0;
  if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');
}
function toggleSection(header){
  const body=header.nextElementSibling;
  const toggle=header.querySelector('.section-toggle');
  if(body.style.display==='none'){body.style.display='';toggle.classList.add('open');}
  else{body.style.display='none';toggle.classList.remove('open');}
}
function showSnapshot(){
  document.getElementById('snapshot-page').style.display='block';
  document.getElementById('detail-page').style.display='none';
  setActive('nav-snapshot');buildSnapshot();
  document.getElementById('main').scrollTop=0;
  if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');
}
function buildSnapshot(){
  const pg=document.getElementById('snapshot-page');
  let html=`<div class="snap-hero"><div class="snap-hero-diag"></div><h1>Weekly Snapshot</h1><p>${DATE_RANGE} &nbsp;·&nbsp; 33 OEMs Monitored &nbsp;·&nbsp; Cox Automotive Sales Intelligence</p></div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#22A846"></div><div class="snap-section-title">Top 3 Opportunities This Week</div></div><div class="top3-grid">`;
  for(const o of TOP3_OPPS)html+=`<div class="top3-card opp"><div class="top3-oem">${o.oem}</div><div class="top3-text">${o.text}</div>${o.link?`<a class="top3-link" href="${o.link}" target="_blank">${o.source} ↗</a>`:''}</div>`;
  html+=`</div></div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#D63535"></div><div class="snap-section-title">Top 3 Risks This Week</div></div><div class="top3-grid">`;
  for(const r of TOP3_RISKS)html+=`<div class="top3-card risk"><div class="top3-oem">${r.oem}</div><div class="top3-text">${r.text}</div>${r.link?`<a class="top3-link" href="${r.link}" target="_blank">${r.source} ↗</a>`:''}</div>`;
  html+=`</div></div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#FF8210"></div><div class="snap-section-title">Industry Trends</div></div>`;
  for(const t of TRENDS)html+=`<div class="trend-card"><div class="trend-title">${t.title}</div><div class="trend-text">${t.text}</div><div class="trend-oems">OEMs: ${t.oems}</div></div>`;
  html+=`</div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#0C80DF"></div><div class="snap-section-title">OEM Status Grid</div></div><div class="status-grid">`;
  for(const oem of OEM_NAMES)html+=`<div class="status-card" onclick="showOEM('${oem}')"><div class="status-card-badge">${statusBadge(oem)}</div><div class="status-card-name">${oem}</div></div>`;
  html+=`</div></div>`;
  pg.innerHTML=html;
}
function downloadDashboard(){
  const html=document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`OEM_Weekly_Intelligence_Brief_${DATE_LABEL}.html`;a.click();URL.revokeObjectURL(url);
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000);
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
buildNav();showSnapshot();

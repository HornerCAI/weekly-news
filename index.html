or reduced Alfa Romeo media support in H2 2026.", "link": "https://moparinsiders.com/stellantis-sets-the-stage-for-a-new-direction-at-investor-day-2026/", "source": "MoparInsiders", "date": "Jan 30, 2026"}]}}, "Audi": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Motor1 confirmed Audi has 7 new models planned for 2026, including the Q9 full-size SUV, A2 EV, RS5, updated Q7, and a China-specific E7X SUV. The Q9 is Audi's largest US model offensive in years and will require significant launch advertising investment when it arrives later in 2026.", "link": "https://www.motor1.com/news/795224/new-audi-models-2026/", "source": "Motor1", "date": "May 9, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Audi's 7-model 2026 pipeline, anchored by the Q9 flagship SUV, signals a major advertising and product push coming in H2 2026. Sales reps should engage Audi marketing teams now ahead of anticipated campaign spend tied to these launches.", "link": "https://www.motor1.com/news/795224/new-audi-models-2026/", "source": "Motor1", "date": "May 9, 2026"}]}}, "Bentley": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Bentley CEO Mike Rocco confirmed the brand's first fully electric SUV \u2014 positioned comparably to the Bentayga at approximately $200K+ \u2014 w y 16, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "BMW opened US preorders for the 2027 iX3 50 xDrive on May 6 at $61,500 starting price with 434-mile EPA-estimated range, 400kW charging, and first US deliveries scheduled September 25, 2026. The iX3 is BMW's first Neue Klasse EV and will carry major launch advertising investment through Q3\u2013Q4 2026.", "link": "https://electrek.co/2026/05/06/bmw-opens-ix3-preorders-61500-up-to-434-miles-range/", "source": "Electrek", "date": "May 6, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "opp", "text": "BMW USA has begun iX3 configurator and reservation marketing, with dealers receiving inventory for display in June and US orders opening formally in June. A major consumer-facing advertising push is expected to ramp significantly ahead of September 25 launch \u2014 prime engagement opportunity.", "link": "https://www.bmwblog.com/2026/05/12/the-bmw-ceo-who-refused-to-go-all-electric-and-was-right/", "source": "BMWBLOG", "date": "May 12, 2026"}], "Sales Signals": [{"type": "opp", "text": "The iX3's September 25 US launch at $61,500 with best-in-class 434-mile range undercuts the Porsche Macan Electric, Audi Q6, and Rivian R1S on price. BMW's simultaneous CEO transition and flagship EV launch create an exceptional engagement window for Cox Automotive's advertising and digital solutions teams.", "link": "https://electrek.co/2026/05/06/bmw-opens-ix3-preorders-61500-up-to-434-miles-range/", "source": "Electrek", "date": "May 6, 2026"}, {"type": "risk", "text": "New CEO Nedeljkovi\u0107 inherits a China market down 10% YoY in Q1 and US tariff headwinds cutting ~1.25 ppts from margins. BMW's advertising flexibility may be constrained as profitability focus intensifies under new leadership.", "link": "https://www.ad-hoc-news.de/boerse/news/ueberblick/bmw-ag-stock-de0005190003-new-ceo-slimmed-down-margins-and-dividend/69350510", "source": "Ad-Hoc-News", "date": "May 16, 2026"}]}}, "Cadillac" ould-lock-wheels", "source": "Autoblog", "date": "May 14, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Chevrolet Performance teased a new engine this week with 'Something BIG is coming,' showing what appears to be a next-generation V8 powerplant. If confirmed as a new high-output truck engine, this would fuel significant advertising momentum around Silverado and Colorado performance variants.", "link": "https://gmauthority.com/blog/2026/05/chevrolet-performance-teases-new-engine-and-it-will-be-big/", "source": "GM Authority", "date": "May 6, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Chevrolet Performance's teased V8 announcement has strong social media engagement and signals upcoming product news that will drive advertising investment around truck and performance segments. Monitor for official reveal timing to align Cox Automotive solutions conversations.", "link": "https://gmauthority.com/blog/2026/05/chevrolet-performance-teases-new-engine-and-it-will-be-big/", "source": "GM Authority", "date": "May 6, 2026"}]}}, "Ford Motor Company": {"status": "none", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "neutral", "text": "No notable signals this week.", "link": "", "source": "", "date": ""}]}}, "General Motors": {"status": "none", "sections": {"Leadership Changes": [{"type": me growth and product expansion is a strong pitch for digital advertising and publisher investment.", "link": "https://www.aol.com/lifestyle/hyundai-kia-genesis-thrive-amid-000944022.html", "source": "AOL/Lifestyle", "date": "May 7, 2026"}]}}, "Honda": {"status": "both", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "risk", "text": "Honda reported its first-ever annual operating loss as a publicly listed company (since 1957) of \u00a5414.3 billion ($2.6B) for FY ending March 2026, driven by EV-related losses totaling \u00a51,577.8 billion. The EV write-downs triggered cancellation of the Honda 0 Series and Acura RSX EVs along with indefinite suspension of the Canadian EV factory project.", "link": "https://finance.yahoo.com/markets/stocks/article/honda-posts-first-ever-loss-plans-big-hybrid-pivot-and-scraps-all-ev-2040-goal-133009019.html", "source": "Yahoo Finance", "date": "May 14, 2026"}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "At Honda's May 14 global business briefing, CEO Toshihiro Mibe announced a strategic pivot to hybrids: 15 next-gen hybrid models globally by FY2030, all Ohio plants converted to hybrid-capable production, 30%+ reduction in hybrid system costs, and the 2040 EV-only goal replaced by 'carbon neutrality by 2050' via a multi-pathway approach.", "link": "https://global.honda/en/newsroom/news/2026/c260514beng.html", "source": "Honda Global", "date": "May 14, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Honda's pivot to hybrids, with 15 new models primarily targeted at North America launching from 2027, signals a major upcoming advertising wave as Honda re-introduces consumers to a completely refreshed lineup. Cox Automotive teams should engage Honda marketing ahead of this product launch cycle.", "link": "https://global.honda/en/newsroom/news/2026/c260514beng.html", "source": "Honda Global", "date": "May 14, 2026"}, {"type": "risk", "text": "Honda's historic operating loss will create near-term marketing budget pressure through FY2027 recovery. Expect Honda to prioritize efficiency and ROI in advertising spend over broad reach plays in H2 2026.", "link": "https://finance.yahoo.com/markets/stocks/article/honda-posts-first-ever-loss-plans-big-hybrid-pivot-and-scraps-all-ev-2040-goal-133009019.html", "source": "Yahoo Finance", "date": "May 14, 2026"}]}}, "Hyundai": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Hyundai confirmed plans to launch 36 new or updated models in North America by 2030, backed by the $26 billion US investment pledge. CEO Jos\u00e9 Mu\u00f1oz confirmed next-gen Elantra and Tucson debut in South Korea this year, with US arrival expected as early as 2027.", "link": "https://www.motor1.com/news/791883/hyundai-genesis-launch-58-vehicles/", "source": "Motor1", "date": "Apr 2, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Hyundai's Sonata Hybrid and Palisade are setting monthly records in 2026, with hybrids and electrified models driving top-line growth. A 36-model product offensive through 2030 signals sustained and growing advertising investment ahead.", "link": "https://www.aol.com/lifestyle/hyundai-kia-genesis-thrive-amid-000944022.html", "source": "AOL/Lifestyle", "date": "May 7, 2026"}]}}, "Infiniti": {"status": "opp", "sections": {"Leadership Changes": [{"t Partnerships": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "neutral", "text": "No notable signals this week.", "link": "", "source": "", "date": ""}]}}, "Nissan": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Nissan confirmed the return of the Infiniti Q50 sport sedan for 2027 (400+ hp twin-turbo V6, potentially with a manual), the launch of the new Nissan Xterra, and a hybrid expansion plan anchored by the upcoming Rogue Hybrid. The turnaround plan targets five new models by 2028 including two new Infiniti body-on-frame SUVs.", "link": "https://www.kbb.com/car-news/infiniti-q50-relaunching-3-new-suvs-planned/", "source": "KBB", "date": "Apr 14, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Nissan's multi-model product offensive through 2028, combined with its fastest-growing US retail sales position (retail up 9.6% in Q1 despite overall volume down), signals a brand on an inflection point. Cox Automotive's solutions teams should position around the Rogue Hybrid and Xterra launch advertising cycles.", "link": "https://usa.infinitinews.com/en-US/", "source": "Infiniti Newsroom", "date": "Apr 2026"}]}}, "Polestar": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Polestar announced that global Polestar 3 production will consolidate exclusively to Volvo's South Carolina US plant from Q4 2026, moving all volume from China to the US-made facility. This eliminates tariff exposure for the Polestar 3 and enables US-sourced vehicles to compete more effectively.", "link": "https://www.wardsauto.com/news/polestar-moves-polestar3-production-volvo-us-plant/816186/", "source": "WardsAuto", "date": "Apr 1, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Polestar 3's shift to US-only production from Q4 2026 removes tariff risk and positions the brand for more competitive pricing. Note that the Polestar 2 remains unavailable in the US due to Chinese manufacturing tariffs, making Polestar 3 the only viable US volume play.", "link": "https://www.wardsauto.com/news/polestar-moves-polestar3-production-volvo-us-plant/816186/", "source": "WardsAuto", "date": "Apr 1, 2026"}]}}, "Porsche": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "The all-electric Porsche Cayenne is confirmed for a 2026 reveal with maximum output up to 1,156 horsepower. This flagship EV will be one of the most powerful production SUVs ever and will drive significant marketing investment from Porsche in ultra-premium digital channels.", "link": "https://www.motor1.com/news/789708/volkswagen-group-products-2026-audi-vw-porsche/", "source": "Motor1", "date": "Mar 11, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Sales Signals": [{"type": "opp", "text": "Porsche's electric Cayenne reveal in 2026 will be the brand's marquee advertising moment of the year, expected to carry significant premium publisher and OTT investment. Engage Porsche marketing now to be positioned ahead of this campaign build.", "link": "https://www.motor1.com/news/789708/volkswagen-group-products-2026-audi-vw-porsche/", "source": "Motor1", "date": "Mar 11, 2026"}]}}, "Rivian": {"status": "opp", "sections": {"Leadership Changes": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Financial Updates": [{"type": "neutral", "text": "No notable updates this week.", "link": "", "source": "", "date": ""}], "Competitive Moves & Partnerships": [{"type": "opp", "text": "Rivian launched the public R2 configurator on May 15, ahead of its previously communicated June timeline \u2014 R2 Performance trim starts at $57,990 (656 hp, 330-mile range). R2 production is actively ramping at Normal, IL, with employee deliveries underway and external customer deliveries described as 'days away.'", "link": "https://electrek.co/2026/05/15/rivian-r2-configurator-live-pricing-options/", "source": "Electrek", "date": "May 15, 2026"}, {"type": "opp", "text": "Rivian's AI-powered voice assistant (Rivian Assistant) rolled out to existing R1 and commercial van fleet vehicles in software update 2026.15 (May 12), adding AI-native voice control replacing Amazon Alexa.", "link": "https://riviantrackr.com/", "source": "RivianTrackr", "date": "May 12, 2026"}, {"type": "opp", "text": "VW brand CEO Thomas Sch\u00e4fer confirmed at the FT Future of the Car Summit that the Rivian-VW software JV (RV Tech) is 'progressing really well' and has 'met all the deadlines,' with the VW ID.1 confirmed as the first VW Group vehicle to use the jointly developed zonal architecture.", "link": "https://eletric-vehicles.com/vw-group/volkswagen/volkswagen-brand-ceo-says-rivian-software-jv-progressing-really-well/", "source": "EV Report", "date": "May 13, 2026"}], "Digital Advertising & Publisher Activity": [{"type": "opp", "text": "Rivian's R2 Block Party tour is running May 15\u201317 in Palo Alto and Miami, with Nashville scheduled May 22\u201324. This experiential marketing campaign paired with the configurator launch represents Rivian's largest consumer activation to date and will generate significant earned media and social engagement.", "link": "https://riviantrackr.com/news/the-sunday-drive-rivian-week-in-review-may-11-to-may-17-2026/", "source": "RivianTrackr", "date": "May 17, 2026"}], "Sales Signals": [{"type": "opp", "text": "The R2 configurator launch ahead of schedule, external customer deliveries 'days away,' 68,000 reservations at the original reveal, and R2 Performance priced to undercut Tesla Model Y Performance ($57,990 vs $58,880) make this the highest-urgency Rivian sales moment yet. Cox Automotive should engage Rivian's marketing team immediately around launch advertising support.", "link": "https://electrek.co/2026/05/15/rivian-r2-configurator-live-pricing-options/", "source": "Electrek", "date": "May 15, 2026"}, {"type": "opp", "text": "Rivian's confirmed Uber robotaxi partnership for autonomous R2-based vehicles in SF and Miami from 2028, plus the VW JV software confirmation, makes Rivian's technology narrative as strong as its product story \u2014 a meaningful competitive positioning tool for Rivian's marketing team to leverage.", "link": "https://eletric-vehicles.com/vw-group/volkswagen/volkswagen-brand-ceo-says-rivian-software-jv-progressing-really-well/", "source": "EV Report", "date": "May 13, 2026"}]}}, "Stellantis": {"status": "both", "sections": {"Leadership Changes": [{"type": "opp", "text": "Stellantis Investor Day is TODAY (May 21, 2026) in Auburn Hills, Michigan, where CEO Antonio Filosa will formally unveil the compa function filterOEMs(q){

function renderBullet(b){
  let cls='bullet-wrap-neutral',prefix='';
  if(b.type==='risk'){cls='bullet-wrap-risk';prefix='<span class="bullet-prefix-risk">⚠️ Risk</span> — ';}
  if(b.type==='opp'){cls='bullet-wrap-opp';prefix='<span class="bullet-prefix-opp">✅ Opportunity</span> — ';}
  if(b.type==='neutral'&&(b.text==='No notable updates this week.'||b.text==='No notable signals this week.'))
    return`<div class="muted-text">${b.text}</div>`;
  let meta='';
  if(b.link&&b.source)meta=`<div class="bullet-meta"><a class="bullet-link" href="${b.link}" target="_blank">${b.source}</a><span class="bullet-date">(Published: ${b.date})</span></div>`;
  return`<div class="${cls}"><div class="bullet-text">${prefix}${b.text}</div>${meta}</div>`;
}

  for(const sec of sections){
    const bullets=data.sections[sec]||[];
    let body=bullets.map(b=>renderBullet(b)).join('');
    html+=`<div class="section-card"><div class="section-header" onclick="toggleSection(this)"><span class="section-title">${sec}</span><span class="section-toggle open">▾</span></div><div class="section-body">${body}</div></div>`;
  }
  document.getElementById('detail-page').innerHTML=html;
  document.getElementById('main').scrollTop=0;
  if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');
}
function toggleSection(header){
  const body=header.nextElementSibling;
  const toggle=header.querySelector('.section-toggle');
  if(body.style.display==='none'){body.style.display='';toggle.classList.add('open');}
  else{body.style.display='none';toggle.classList.remove('open');}
}
function showSnapshot(){
  document.getElementById('snapshot-page').style.display='block';
  document.getElementById('detail-page').style.display='none';
  setActive('nav-snapshot');buildSnapshot();
  document.getElementById('main').scrollTop=0;
  if(window.innerWidth<768)document.getElementById('sidebar').classList.remove('open');
}
function buildSnapshot(){
  const pg=document.getElementById('snapshot-page');
  let html=`<div class="snap-hero"><div class="snap-hero-diag"></div><h1>Weekly Snapshot</h1><p>${DATE_RANGE} &nbsp;·&nbsp; 33 OEMs Monitored &nbsp;·&nbsp; Cox Automotive Sales Intelligence</p></div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#22A846"></div><div class="snap-section-title">Top 3 Opportunities This Week</div></div><div class="top3-grid">`;
  for(const o of TOP3_OPPS)html+=`<div class="top3-card opp"><div class="top3-oem">${o.oem}</div><div class="top3-text">${o.text}</div>${o.link?`<a class="top3-link" href="${o.link}" target="_blank">${o.source} ↗</a>`:''}</div>`;
  html+=`</div></div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#D63535"></div><div class="snap-section-title">Top 3 Risks This Week</div></div><div class="top3-grid">`;
  for(const r of TOP3_RISKS)html+=`<div class="top3-card risk"><div class="top3-oem">${r.oem}</div><div class="top3-text">${r.text}</div>${r.link?`<a class="top3-link" href="${r.link}" target="_blank">${r.source} ↗</a>`:''}</div>`;
  html+=`</div></div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#FF8210"></div><div class="snap-section-title">Industry Trends</div></div>`;
  for(const t of TRENDS)html+=`<div class="trend-card"><div class="trend-title">${t.title}</div><div class="trend-text">${t.text}</div><div class="trend-oems">OEMs: ${t.oems}</div></div>`;
  html+=`</div>`;
  html+=`<div class="snap-section"><div class="snap-section-header"><div class="snap-section-line" style="background:#0C80DF"></div><div class="snap-section-title">OEM Status Grid</div></div><div class="status-grid">`;
  for(const oem of OEM_NAMES)html+=`<div class="status-card" onclick="showOEM('${oem}')"><div class="status-card-badge">${statusBadge(oem)}</div><div class="status-card-name">${oem}</div></div>`;
  html+=`</div></div>`;
  pg.innerHTML=html;
}
function downloadDashboard(){
  const html=document.documentElement.outerHTML;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`OEM_Weekly_Intelligence_Brief_${DATE_LABEL}.html`;a.click();URL.revokeObjectURL(url);
  const toast=document.getElementById('toast');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000);
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
buildNav();showSnapshot();

</script>
